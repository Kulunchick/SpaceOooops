[package]
name = "spaceooops"
version = "0.1.0"
edition = "2024"

[lib]
name = "spaceooops"
path = "src/lib.rs"

[[bin]]
name = "spaceooops-app"
path = "src/main.rs"

[dependencies]
leptos = { version = "=0.8.23", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
