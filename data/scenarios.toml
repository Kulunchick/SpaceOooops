# Scenarios: the mission briefs players choose from.
# Instrument fit and Orbit coverage per Scenario live in instruments.toml and orbits.toml,
# keyed by the scenario id used here.

[[scenarios]]
id = "crop-watch"
name = "Crop Watch"
difficulty = "Easy"
objective = "Image Angola's farmland from a sun-synchronous Orbit every few days to track drought and crop health through a growing season."
why_it_matters = "Most Angolan farms depend on rain. When the rains fail in the south, crops and cattle are lost before anyone can react. Regular images from space show where plants are stressed weeks earlier, so help and water can be sent in time."
required_science_value = 100.0
# One full growing season plus margin.
min_lifetime_days = 365
# source: university / national-agency 6U Earth-observation CubeSat missions typically cost about US$1-3 million including launch (NASA CubeSat 101, ch. 1).
budget_usd = 1_800_000.0
# Globe marker: Ondjiva, Cunene: the dry southern farmland.
marker_lat = -17.07
marker_lon = 15.73
# Placeholder art (own work); swap the file or this path when the team supplies images.
illustration = "assets/images/scenarios/crop-watch.svg"
key_constraints = [
    "A sharp imager needs reaction wheels to point at the ground.",
    "A CubeSat rideshare carries only a small Mass.",
    "Images are large: the comms link must send them down every day.",
]
tutorial_hints = [
    "Start on the Science tab: pick one Instrument that suits drought monitoring.",
    "On the Spacecraft tab, check the Power gauge: imagers and reaction wheels need deployable solar panels.",
    "On the Launch & Orbit tab, a sun-synchronous Orbit passes over Angola at the same local time every day.",
    "On the Budget & Comms tab, make sure the Data gauge stays green.",
]
# Science Value earned per GB of Data delivered by an Instrument with fit 1.0 over an Orbit with coverage 1.0.
# Game-tuned: a single well-suited imager sending ~300 MB a day for a year earns about 1.5x the requirement.
science_value_per_gb = 1.4
# The country the Scenario serves (id keys the globe outline).
target_country = { id = "angola", name = "Angola" }

# Random Event tuning for this Scenario (chances are per day).
[scenarios.events]
# source: NOAA SWPC - strong (X-class) flares come a few times a year near solar maximum; ~1.5 per year here.
solar_flare_daily_chance = 0.004
# Spacecraft typically sit in safe mode for a day or two after a radiation upset.
flare_safe_mode_days = 2
# On a flare day every Component is this many times more likely to fail (single-event upsets).
flare_failure_multiplier = 20.0
# Ground-station outages (weather, maintenance, network faults): about twice a year.
outage_daily_chance = 0.006
outage_days = 3
# New Random Events (data/events.toml) per Run, at least and at most; 0 and 0 switch them off.
new_events_min = 5
new_events_max = 8

# Ground stations, main first: near Luanda, and a commercial site near Johannesburg (outage backup).
[[scenarios.ground_stations]]
name = "Luanda"
lat = -8.92
lon = 13.18

[[scenarios.ground_stations]]
name = "Johannesburg"
lat = -25.89
lon = 27.69

[[scenarios]]
id = "connect-the-villages"
name = "Connect the Villages"
difficulty = "Medium"
objective = "Relay phone and internet traffic to remote villages across Angola from geostationary Orbit, for a one-year pilot service."
why_it_matters = "Many villages in Angola's eastern and southern provinces are hundreds of kilometres from the nearest mobile mast or fibre cable. A satellite that stays over Angola can reach every village at once through a small dish, connecting schools, clinics and families. Angola already runs its own large communications satellite, AngoSat-2, launched in 2022; a small pilot shows how cheaply the next step could be tested."
required_science_value = 100.0
# A one-year pilot service.
min_lifetime_days = 365
# source: game estimate. Small-GEO pilot missions are far cheaper than a full ~US$300 million comsat, but the
# launch to GEO alone costs millions.
budget_usd = 6_000_000.0
# Globe marker: Luena, Moxico: the remote eastern provinces.
marker_lat = -11.78
marker_lon = 19.92
# Placeholder art (own work); swap the file or this path when the team supplies images.
illustration = "assets/images/scenarios/connect-the-villages.svg"
key_constraints = [
    "Only a satellite in geostationary Orbit (GEO) stays over Angola all day.",
    "The launch to GEO is expensive, and the affordable slot carries only 18 kg.",
    "The relay's dish must be pointed precisely at Angola.",
]
# Science Value here is service delivered: a relay carrying ~2 GB a day for a year earns about 1.4x the requirement.
science_value_per_gb = 0.2
# The country the Scenario serves (id keys the globe outline).
target_country = { id = "angola", name = "Angola" }

[scenarios.events]
# source: NOAA SWPC - strong (X-class) flares a few times a year near solar maximum.
solar_flare_daily_chance = 0.004
flare_safe_mode_days = 2
# GEO lies outside most of the magnetosphere's shielding, so a flare hits harder than in low Orbit.
flare_failure_multiplier = 30.0
outage_daily_chance = 0.006
outage_days = 3
# New Random Events (data/events.toml) per Run, at least and at most; 0 and 0 switch them off.
new_events_min = 5
new_events_max = 8

# Ground stations, main first: near Luanda, and a commercial site near Johannesburg (outage backup).
[[scenarios.ground_stations]]
name = "Luanda"
lat = -8.92
lon = 13.18

[[scenarios.ground_stations]]
name = "Johannesburg"
lat = -25.89
lon = 27.69

[[scenarios]]
id = "space-weather-sentinel"
name = "Space Weather Sentinel"
difficulty = "Hard"
objective = "Measure radiation and the ionosphere over the South Atlantic Anomaly and southern Africa from a 400 km Orbit for six months, with more than one Instrument."
why_it_matters = "Solar storms disturb the ionosphere, the charged top layer of the atmosphere. That throws GPS positions off by metres, cuts radio links and can damage satellites. Over the South Atlantic Anomaly, which reaches toward southern Africa, Earth's radiation belt dips closest to the ground. Few instruments watch this region, so better measurements help forecast storms for Angola and its neighbours."
required_science_value = 70.0
# A six-month measurement campaign: short enough to finish before drag brings a 400 km CubeSat down.
min_lifetime_days = 180
# source: game estimate; university space-weather CubeSats typically cost about US$1-2 million including launch.
budget_usd = 1_500_000.0
# Globe marker: Luanda: the ground station, on the Atlantic coast facing the South Atlantic Anomaly.
marker_lat = -8.84
marker_lon = 13.23
# Placeholder art (own work); swap the file or this path when the team supplies images.
illustration = "assets/images/scenarios/space-weather-sentinel.svg"
key_constraints = [
    "One Instrument is not enough: you need several to reach the Science goal.",
    "At 400 km, air drag brings a CubeSat down within about a year.",
    "Passes over the ground station are short: heavy Data needs a fast radio.",
    "The Budget is small.",
]
# Game-tuned: a particle detector and an ionosphere probe delivering all their Data for six months earn about
# 1.2x the requirement; losing a quarter of the Data falls short.
science_value_per_gb = 1.0
# The country the Scenario serves (id keys the globe outline).
target_country = { id = "angola", name = "Angola" }

[scenarios.events]
# The mission flies near solar maximum, when flares are most frequent (NOAA SWPC); ~3 per year here.
solar_flare_daily_chance = 0.008
flare_safe_mode_days = 2
flare_failure_multiplier = 20.0
# A single university ground station: outages about three to four times a year.
outage_daily_chance = 0.01
outage_days = 3
# New Random Events (data/events.toml) per Run, at least and at most; 0 and 0 switch them off.
new_events_min = 5
new_events_max = 8

# Ground stations, main first: near Luanda, and a commercial site near Johannesburg (outage backup).
[[scenarios.ground_stations]]
name = "Luanda"
lat = -8.92
lon = 13.18

[[scenarios.ground_stations]]
name = "Johannesburg"
lat = -25.89
lon = 27.69

# ---------------------------------------------------------------- World Scenarios

[[scenarios]]
id = "amazon-watch"
name = "Amazon Watch"
difficulty = "Medium"
objective = "Watch the Brazilian Amazon from a sun-synchronous Orbit for a year and spot new forest clearing quickly, through the clouds that cover the forest most days."
why_it_matters = "The Amazon rainforest breathes out huge amounts of water vapour, so thick clouds hang over it for much of the year, worst in the rainy season. An ordinary camera sees only the tops of the clouds. Clearing goes on under them, and an alert that comes weeks late arrives after the trees are gone. Brazil watches its forest from space so that inspectors can be sent while the clearing can still be stopped."
required_science_value = 100.0
# One full year: a rainy season and a dry season.
min_lifetime_days = 365
# source: game estimate. A radar costs more than a camera and the heavier spacecraft needs a SmallSat rideshare
# slot; still far below a real ~600 kg national Earth-observation satellite.
budget_usd = 4_000_000.0
# Globe marker: the deforestation frontier in southern Pará, near Novo Progresso, where clearing meets the forest.
marker_lat = -7.0
marker_lon = -55.4
# Placeholder art (own work); swap the file or this path when the team supplies images.
illustration = "assets/images/scenarios/amazon-watch.svg"
key_constraints = [
    "Clouds cover the Amazon most days: a camera sees little of the forest.",
    "A radar sees through cloud and at night, but it is heavy, power-hungry and expensive.",
    "The radar's Data is heavy: the comms link must send it down every day.",
]
tutorial_hints = [
    "Start on the Science tab: compare how well each Instrument suits this Scenario. Clouds blind the cameras here.",
    "The radar is big and heavy: on the Spacecraft tab pick a Structure with room for it, and deployable solar panels for its Power.",
    "On the Launch & Orbit tab, check that the Launch Vehicle can carry your Mass to the sun-synchronous Orbit.",
    "On the Budget & Comms tab, make sure the radio can send the radar's Data down: watch the Data gauge.",
]
# Game-tuned: the radar sending ~1.5 GB a day for a year earns about 1.5x the requirement; a camera whose
# pictures are mostly cloud earns a small fraction of it.
science_value_per_gb = 0.27
# The country the Scenario serves (id keys the globe outline).
target_country = { id = "brazil", name = "Brazil" }

[scenarios.events]
# source: NOAA SWPC - strong (X-class) flares a few times a year near solar maximum; ~1.5 per year here.
solar_flare_daily_chance = 0.004
flare_safe_mode_days = 2
flare_failure_multiplier = 20.0
# Two national stations that back each other up: outages about twice a year.
outage_daily_chance = 0.006
outage_days = 3
# New Random Events (data/events.toml) per Run, at least and at most; 0 and 0 switch them off.
new_events_min = 5
new_events_max = 8

# Ground stations, main first: INPE's tracking and control stations at Cuiabá and Alcântara (backup).
# source: USGS Landsat ground station list, station CUB (INPE, Cuiabá): -15.5528, -56.0733; it lists
# Amazonia-1 among the satellites the station tracks and controls (https://landsat.usgs.gov/CUB).
[[scenarios.ground_stations]]
name = "Cuiabá"
lat = -15.55
lon = -56.07

# source: INPE's Alcântara tracking and control station (ETA) is in Alcântara, Maranhão (gov.br service page
# for INPE's tracking and control); position of the Alcântara launch centre beside it, 2.34 S 44.42 W
# (Wikipedia, Alcântara Space Center; secondary).
[[scenarios.ground_stations]]
name = "Alcântara"
lat = -2.34
lon = -44.42

[[scenarios]]
id = "glacier-watch"
name = "Glacier Watch"
difficulty = "Easy"
objective = "Photograph the Patagonian ice fields from a sun-synchronous Orbit for two years, to measure how fast the glaciers are retreating."
why_it_matters = "Patagonia holds the largest ice fields outside Antarctica and Greenland, and most of its glaciers are shrinking. Their meltwater feeds rivers and lakes and adds to sea level. One year of pictures cannot tell a bad summer from a lasting change: a trend appears only when the same ice is seen again and again over years. Argentina's space agency, CONAE, watches its glaciers from space for that reason."
required_science_value = 100.0
# Two full years: two summers and two winters, enough to tell a trend from one warm season.
min_lifetime_days = 730
# source: game estimate. The same small camera satellite as Crop Watch, but with two years of operations to pay for.
budget_usd = 2_500_000.0
# Globe marker: the Southern Patagonian Ice Field above Lago Argentino, Santa Cruz (Perito Moreno glacier area).
marker_lat = -50.5
marker_lon = -73.0
# Placeholder art (own work); swap the file or this path when the team supplies images.
illustration = "assets/images/scenarios/glacier-watch.svg"
key_constraints = [
    "A glacier trend needs years of pictures: the spacecraft must last two years.",
    "A 400 km Orbit sinks into the air within a year (300 days here); a sun-synchronous Orbit lasts years.",
    "A sharp camera needs reaction wheels to point at the ground.",
]
tutorial_hints = [
    "Start on the Science tab: one plain camera is enough here. Compare how well each Instrument suits ice.",
    "Check the Lifetime on the Launch & Orbit tab: the Mission needs two years, and only some Orbits last that long.",
    "On the Spacecraft tab, imagers and reaction wheels need deployable solar panels: watch the Power gauge.",
    "On the Budget & Comms tab, two years of operations cost money: check the Budget gauge and the Data gauge.",
]
# Game-tuned: a well-suited imager sending ~300 MB a day for two years earns about 1.5x the requirement.
science_value_per_gb = 0.7
# The country the Scenario serves (id keys the globe outline).
target_country = { id = "argentina", name = "Argentina" }

[scenarios.events]
# source: NOAA SWPC - strong (X-class) flares a few times a year near solar maximum; ~1.5 per year here.
solar_flare_daily_chance = 0.004
flare_safe_mode_days = 2
flare_failure_multiplier = 20.0
# Two stations that back each other up: outages about twice a year.
outage_daily_chance = 0.006
outage_days = 3
# New Random Events (data/events.toml) per Run, at least and at most; 0 and 0 switch them off.
new_events_min = 5
new_events_max = 8

# Ground stations, main first: CONAE's Córdoba ground station at the Teófilo Tabanera Space Center, and its
# Tierra del Fuego station at Tolhuin (backup).
# source: Teófilo Tabanera Space Center, Falda del Cañete, Córdoba: 31 31' 29" S, 64 28' 02" W (Wikidata and
# Wikimedia Commons; CONAE's own page gives the address, Ruta C45 km 8, but no numbers).
[[scenarios.ground_stations]]
name = "Córdoba"
lat = -31.52
lon = -64.47

# source: CONAE Tierra del Fuego Ground Station, Tolhuin: 54 30' 37" S, 67 06' 54" W (Wikidata and Wikimedia Commons).
# CONAE has only planned a station in Ushuaia itself, so the real station is used.
[[scenarios.ground_stations]]
name = "Tierra del Fuego"
lat = -54.51
lon = -67.12
