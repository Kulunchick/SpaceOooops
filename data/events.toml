[[events]]
id = "a-rare-sight-lands-in-frame"
group = "lucky"
title = "A rare sight landed in frame"
log = "A volcano erupted just as the camera passed over it. The picture is worth a lot to scientists: bonus Science Value."
scene = "bonus-glow"
real_life = "Satellite cameras have caught eruptions, algal blooms and auroras by luck of timing, and those pictures often make the news."
only = "camera"
effects = [{ mechanic = "science-bonus", strength = 0.03 }]

[[events]]
id = "a-photo-goes-viral"
group = "lucky"
title = "A photo from the satellite went viral"
log = "One of the satellite's photos went viral. A foundation noticed and gave a grant of $70,000."
scene = "bonus-glow"
real_life = "Pictures from small satellites often win public attention, and attention brings grants and sponsors."
only = "camera"
effects = [{ mechanic = "budget", strength = 70000.0 }]
