[[events]]
id = "radio-amateurs-pick-up-your-signal"
group = "lucky"
title = "Radio amateurs around the world picked up your signal"
log = "Radio amateurs around the world picked up your signal and passed the Data on: 50% more downlink for 3 days."
scene = "bonus-glow"
real_life = "Amateurs have received, decoded and relayed the signals of small satellites, and some missions depend on them."
only = "uhf-radio"
