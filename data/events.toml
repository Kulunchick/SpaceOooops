title = "Russell's teapot knocks on the hull"
log = "Something small and china-shaped knocked on the hull and the pointing wobbled: pointing was 50% worse for 1 day."
scene = "visitor"
effects = [{ mechanic = "pointing", strength = -0.5, days = 1 }]

[[events]]
id = "gremlins-chew-the-wiring"
group = "fantasy"
title = "Gremlins chew the wiring"
log = "Gremlins chewed on the wiring and cut the Power by 30% for 3 days, then got bored and left."
scene = "panel-shading"
effects = [{ mechanic = "power", strength = -0.3, days = 3 }]

[[events]]
id = "aliens-borrow-the-satellite"
group = "fantasy"
title = "Aliens borrow the satellite for experiments"
log = "Aliens borrowed the satellite for experiments: Instruments off for 2 days. They returned it with washed panels: 2% more Power from then on."
scene = "visitor"
effects = [{ mechanic = "instruments-off", days = 2 }, { mechanic = "power", strength = 0.02, to_end = true, delay = 2 }]

[[events]]
id = "witch-on-a-broom"
group = "fantasy"
title = "A witch on a broom crosses the orbit"
log = "A witch on a broom crossed the orbit. The spacecraft dodged: Instruments off for 1 day."
scene = "fly-by"
effects = [{ mechanic = "instruments-off", days = 1 }]

[[events]]
id = "time-loop"
group = "fantasy"
title = "Time loop"
log = "The satellite lived one day twice. Nobody can explain it, but there is an extra day of Data."
scene = "bonus-glow"
effects = [{ mechanic = "extra-data-day" }]

[[events]]
id = "a-sponsor-chips-in"
group = "lucky"
title = "A sponsor chips in"
log = "A company liked the Mission and chipped in $80,000 for its logo on the website."
scene = "bonus-glow"
real_life = "Small missions often raise money from sponsors, in exchange for a name on the spacecraft or the website."
effects = [{ mechanic = "budget", strength = 80000.0 }]

[[events]]
id = "neighbouring-station-gives-away-passes"
group = "lucky"
title = "A neighbouring station gives away passes"
log = "A neighbouring ground station had free time and gave away its passes: 50% more downlink for 5 days."
scene = "link-interference"
real_life = "Ground stations around the world share spare time, and a mission with an idle neighbour can borrow extra contact time."
effects = [{ mechanic = "downlink", strength = 0.5, days = 5 }]

[[events]]
id = "programmers-compress-data-better"
group = "lucky"
title = "The programmers compress Data better"
log = "The programmers found a better way to compress the Data: 5% more downlink from then on."
scene = "bonus-glow"
real_life = "Flight software is often improved in orbit; a better compression routine sends more science through the same radio link."
effects = [{ mechanic = "downlink", strength = 0.05, to_end = true }]

[[events]]
id = "quiet-sun"
group = "lucky"
title = "Quiet Sun"
log = "The Sun was calm for a month, and the Components were less likely to fail: half the usual failure chance for 30 days."
scene = "bonus-glow"
real_life = "Solar activity follows an 11-year cycle, and quiet stretches mean less radiation damage to electronics."
effects = [{ mechanic = "failure-chance", strength = -0.5, days = 30 }]

[[events]]
id = "panels-beat-the-estimate"
group = "lucky"
title = "The panels beat the estimate"
log = "The panels turned out to make 3% more Power than the datasheet promised, for the rest of the Mission."
scene = "bonus-glow"
real_life = "Datasheets are conservative; real solar cells often beat their rated output early in life."
effects = [{ mechanic = "power", strength = 0.03, to_end = true }]

# ==== 05: events that depend on the Design ===================================
# Conditions (only, more_likely), mitigations, and `when` effects; 12, 17 and 21 ask a question.
# ============================================================================

[[events]]
id = "micrometeoroid-through-a-panel"
group = "real"
title = "A micrometeoroid went through a panel"
log = "A grain of space dust the size of a sand speck punched through a solar panel: 5% less Power for the rest of the Mission."
scene = "hit"
real_life = "Space is full of tiny fast particles, and spacecraft panels collect small pits and holes from them over the years. Large wings catch more of them."
more_likely = { fact = "deployable-panels", weight = 2 }
effects = [{ mechanic = "power", strength = -0.05, to_end = true }]

[[events]]
id = "bit-flipped-by-a-cosmic-ray"
group = "real"
title = "A cosmic ray flipped a bit"
log = "A cosmic ray flipped one bit in the computer's memory. It rebooted to be safe: Instruments off for 1 day."
scene = "hit"
real_life = "Charged particles can flip a bit in memory (a single-event upset). Computers built and tested for space use error-correcting memory, so they notice and fix it."
mitigation = { fact = "computer-flight-proven", scale = 0.0, log = "A cosmic ray flipped one bit in the computer's memory. The Flight-proven computer corrected it without even rebooting." }
effects = [{ mechanic = "instruments-off", days = 1 }]

[[events]]
id = "a-bad-week-over-the-south-atlantic"
group = "real"
title = "A bad week over the South Atlantic"
log = "The spacecraft crossed the South Atlantic Anomaly again and again. Radiation noise speckled the images: 40% less Data for 3 days."
scene = "link-interference"
real_life = "Over the South Atlantic Earth's magnetic field dips and radiation reaches lower down, so low-orbit satellites see noisy images and glitches there."
only = "low-orbit"
effects = [{ mechanic = "data", strength = -0.4, days = 3 }]

[[events]]
id = "geomagnetic-storm-puffs-up-the-atmosphere"
group = "real"
title = "A geomagnetic storm puffed up the atmosphere"
log = "A storm on the Sun heated and puffed up the thin upper atmosphere. The extra drag pushed the spacecraft around: pointing was 50% worse for 3 days."
scene = "link-interference"
real_life = "Solar storms swell Earth's upper atmosphere; in 2022 a storm dragged a batch of freshly launched satellites down to a fiery end."
only = "low-orbit"
effects = [{ mechanic = "pointing", strength = -0.5, days = 3 }]

[[events]]
id = "atomic-oxygen-eats-the-coating"
group = "real"
title = "Atomic oxygen ate the coating"
log = "Single oxygen atoms, which are common in low Orbit, slowly ate the coating on the panels: 3% less Power for the rest of the Mission."
scene = "panel-shading"
real_life = "In low Orbit a spacecraft flies through a thin gas of single oxygen atoms that erodes plastics and coatings, so designers protect surfaces against it."
only = "low-orbit"
effects = [{ mechanic = "power", strength = -0.03, to_end = true }]

[[events]]
id = "static-discharge-on-the-hull"
group = "real"
title = "Static discharge on the hull"
log = "Charge built up on the hull until it sparked. The radio went quiet to recover: no downlink for 1 day."
scene = "hit"
real_life = "Spacecraft charge up in the hot, thin plasma of high Orbits and can discharge in a spark that upsets electronics."
more_likely = { fact = "high-orbit", weight = 3 }
effects = [{ mechanic = "downlink", strength = -1.0, days = 1 }]

[[events]]
id = "the-moon-blinds-the-star-tracker"
group = "real"
title = "The Moon blinded the star tracker"
log = "The bright Moon slid into the star tracker's view and washed out the stars. The spacecraft lost its fine aim: pointing was 50% worse for 1 day."
scene = "fly-by"
real_life = "Star trackers find their direction by recognising star patterns, and the Sun, the Moon or Earth's glow in their view can blind them for a while."
only = "precise-attitude"
effects = [{ mechanic = "pointing", strength = -0.5, days = 1 }]

[[events]]
id = "a-panel-did-not-open-all-the-way"
group = "real"
title = "A panel did not open all the way"
scene = "panel-shading"
real_life = "Solar wings have stuck part way open on real spacecraft; operators have tried shaking them loose with the attitude control, and sometimes it worked."
only = "deployable-panels"

[events.question]
text = "One solar wing opened only part way. Try to shake it open with the reaction wheels?"
default = "leave"

[[events.question.options]]
id = "shake"
label = "Shake it with the reaction wheels"
consequence = "Free. It probably opens, but if it does not, the spacecraft wobbles."
log = "The reaction wheels shook the wing and it clicked fully open."
note = "the wing opened"
effects = []
chance = 0.6
bad = { log = "The shaking did not free the wing and the spacecraft wobbled: pointing was 50% worse for 2 days.", note = "the wing stayed stuck and the spacecraft wobbled", effects = [{ mechanic = "pointing", strength = -0.5, days = 2 }] }

[[events.question.options]]
id = "leave"
label = "Leave it"
consequence = "Free, but the panel gives 10% less Power for the rest of the Mission."
log = "The wing was left half open: 10% less Power for the rest of the Mission."
note = "the wing stayed half open"
effects = [{ mechanic = "power", strength = -0.1, to_end = true }]

[[events]]
id = "storage-full-of-debug-logs"
group = "real"
title = "Storage full of debug logs"
log = "The flight software wrote debug logs into the Data storage until it was half full: half the room for Data for 2 days."
scene = "link-interference"
real_life = "Debug logging left switched on has filled the storage of real spacecraft; a computer with more headroom would not notice."
mitigation = { fact = "computer-flight-proven", scale = 0.0, log = "The flight software wrote debug logs into the Data storage. The Flight-proven computer cleaned them up on its own and nothing was lost." }
effects = [{ mechanic = "storage", strength = -0.5, days = 2 }]

[[events]]
id = "a-reaction-wheel-starts-to-vibrate"
group = "real"
title = "A reaction wheel started to vibrate"
log = "A reaction wheel began to vibrate and blurred the pictures: 30% less Data for 3 days."
scene = "hit"
real_life = "A worn wheel bearing makes a spacecraft jitter, which blurs images; simple attitude control with little margin suffers more."
more_likely = { fact = "attitude-basic", weight = 3 }
effects = [{ mechanic = "data", strength = -0.3, days = 3 }]

[[events]]
id = "the-lens-cover-froze-shut"
group = "real"
title = "The lens cover froze shut"
scene = "panel-shading"
real_life = "Covers and doors on cold instruments have stuck on real missions; warming them in the Sun is the classic fix."
only = "camera"

[events.question]
text = "The lens cover froze shut. Warm it in the Sun, or wait for it to thaw by itself?"
default = "wait"

[[events.question.options]]
id = "warm"
label = "Warm it in the Sun"
consequence = "Free. The Instruments are off for 1 day while the spacecraft turns toward the Sun."
log = "The spacecraft turned the camera toward the Sun and the cover thawed: Instruments off for 1 day."
note = "the cover thawed after a day in the Sun"
effects = [{ mechanic = "instruments-off", days = 1 }]

[[events.question.options]]
id = "wait"
label = "Wait"
consequence = "Free, but the Instruments stay blind for 3 days."
log = "The cover thawed only by itself, slowly: Instruments off for 3 days."
note = "the cover stayed shut for 3 days"
effects = [{ mechanic = "instruments-off", days = 3 }]

[[events]]
id = "condensation-on-the-lens"
group = "real"
title = "Condensation on the lens"
scene = "panel-shading"
real_life = "Moisture trapped in a camera before launch can condense on a cold lens in orbit; teams bake spacecraft in a vacuum chamber to drive it out."
only = "camera"

[events.question]
text = "Moisture has condensed on the lens. Bake it off, or shoot through it?"
default = "shoot"

[[events.question.options]]
id = "bake"
label = "Bake it off"
consequence = "Free. The Instruments are off for 1 day while the lens warms."
log = "The lens was warmed until the moisture boiled off: Instruments off for 1 day."
note = "the lens was baked clear"
effects = [{ mechanic = "instruments-off", days = 1 }]

[[events.question.options]]
id = "shoot"
label = "Shoot through it"
consequence = "Free, but the pictures are foggy: 30% less Data for 5 days."
log = "The camera kept shooting through the fog: 30% less Data for 5 days."
note = "the pictures were foggy"
effects = [{ mechanic = "data", strength = -0.3, days = 5 }]

[[events]]
id = "radio-amateur-jams-the-frequency"
group = "real"
title = "A radio amateur jammed the frequency by accident"
log = "A radio amateur with a powerful transmitter used your frequency by accident: 50% less downlink for 2 days."
scene = "link-interference"
real_life = "The UHF band is shared with amateur radio, and a strong ground transmitter on a close frequency can drown out a small satellite's signal."
only = "uhf-radio"
effects = [{ mechanic = "downlink", strength = -0.5, days = 2 }]

[[events]]
