# Real missions for the Real-Mission Match in the Debrief. `sim` picks the closest one to the player's Design:
# objective first (shared purpose tags), then Orbit class, then spacecraft size.
# Every fact here was checked against the page in `url` (opened in November 2026). `verified` says whether
# that page is the operator / NASA (primary) or a reference catalogue or news site (secondary).
# No logos or mission insignia are used: names in plain text only.

# Which purposes each Scenario's objective counts as, keyed by scenario id.
[scenario_purposes]
crop-watch = ["agriculture", "earth-observation"]
connect-the-villages = ["remote-connectivity", "communications"]
space-weather-sentinel = ["space-weather", "ionosphere", "radiation"]
amazon-watch = ["deforestation", "earth-observation"]
cyclone-watch = ["weather", "earth-observation"]
japan-disaster-response = ["disaster-response", "earth-observation"]
glacier-watch = ["glaciers", "earth-observation"]

# Plain words for each purpose tag, used in the "why this match" line.
[purpose_words]
agriculture = "farm monitoring"
earth-observation = "imaging the ground"
deforestation = "watching forests for clearing"
weather = "watching the weather"
disaster-response = "imaging disaster areas for rescue teams"
glaciers = "watching glaciers and ice"
remote-connectivity = "connecting remote places"
communications = "communications"
store-and-forward = "store-and-forward messaging"
space-weather = "space weather"
ionosphere = "the ionosphere"
radiation = "space radiation"

# Orbit classes (orbits.toml gives each Orbit one).
[orbit_classes]
leo = "low Earth orbit"
sso = "sun-synchronous orbit"
geo = "geostationary orbit"

# Spacecraft classes, smallest first (`rank`); components.toml gives each Structure one.
[spacecraft_classes.cubesat]
name = "a CubeSat"
rank = 0
[spacecraft_classes.smallsat]
name = "a SmallSat"
rank = 1
[spacecraft_classes.large]
name = "a large satellite"
rank = 2

# ---------------------------------------------------------------- Earth observation / agriculture

[[real_missions]]
name = "Planet Dove (Flock 3p)"
operator = "Planet"
year = 2017
orbit_class = "sso"
spacecraft_class = "cubesat"
size_u = 3.0
mass_kg = 5.0
size_note = "3U CubeSat, about 5 kg"
purposes = ["earth-observation", "agriculture"]
blurb = "In 2017 Planet launched 88 Dove 3U CubeSats at once into sun-synchronous orbit, enough to image all of Earth's land every day, for uses such as agriculture."
url = "https://www.eoportal.org/satellite-missions/planet"
# secondary (eoPortal, ESA-run catalogue); ~5 kg is stated for the Flock 1 Doves.
verified = "secondary"

[[real_missions]]
name = "EOS SAT-1"
operator = "EOS Data Analytics (EOSDA)"
year = 2023
orbit_class = "sso"
spacecraft_class = "smallsat"
mass_kg = 178.0
size_note = "SmallSat, about 178 kg"
purposes = ["agriculture", "earth-observation"]
blurb = "EOS SAT-1 is an agriculture-focused satellite in a 540 km sun-synchronous orbit that tracks soil moisture, expected harvests and crop growth."
url = "https://www.eoportal.org/satellite-missions/eos-sat-1"
# secondary (eoPortal); the operator's blog https://eos.com/blog/eosda-sent-its-first-agro-satellite-on-jan-3-to-orbit/ confirms the purpose.
verified = "secondary"

[[real_missions]]
name = "Amazonia-1"
operator = "INPE (Brazil's National Institute for Space Research), for the Brazilian Space Agency"
year = 2021
orbit_class = "sso"
spacecraft_class = "large"
mass_kg = 637.0
size_note = "Earth-observation satellite, about 637 kg"
purposes = ["deforestation", "earth-observation"]
blurb = "Amazonia-1, a Brazilian Earth-observation satellite, was launched on an Indian PSLV rocket on 28 February 2021 into a 752 km sun-synchronous orbit to watch for deforestation, above all in the Amazon."
url = "https://www.eoportal.org/satellite-missions/amazonia-1"
# secondary (eoPortal, ESA-run catalogue): launch 28 February 2021 on PSLV-C51, 637 kg, 752 km SSO, Wide Field
# Imager camera, "the prime objective is to monitor deforestation". The USGS station page
# https://landsat.usgs.gov/CUB confirms INPE's Cuiabá station tracks it (AMZ1). Amazonia-1 carries a camera, not
# a radar: it matches by objective and Orbit.
verified = "secondary"

[[real_missions]]
name = "ALOS-2 (Daichi-2)"
operator = "JAXA (Japan Aerospace Exploration Agency)"
year = 2014
orbit_class = "sso"
spacecraft_class = "large"
mass_kg = 2120.0
size_note = "radar Earth-observation satellite, about 2,120 kg"
purposes = ["disaster-response", "earth-observation"]
blurb = "ALOS-2 (Daichi-2) is a Japanese radar satellite launched on an H-IIA rocket on 24 May 2014 into a 628 km sun-synchronous orbit. Its L-band radar sees through cloud and darkness, and disaster monitoring, with fast access to damaged areas, is one of its main jobs."
url = "https://www.eoportal.org/satellite-missions/alos-2"
# secondary (eoPortal, ESA-run catalogue): launch 24 May 2014 on H-IIA F24 from Tanegashima, 2,120 kg, SSO 628 km
# at 97.9 degrees, instruments PALSAR-2 (L-band SAR), CIRC and SPAISE2, operator JAXA; the page lists "Disaster
# monitoring (secure public safety)" as a primary objective with fast access to damaged areas.
verified = "secondary"

[[real_missions]]
name = "SAOCOM"
operator = "CONAE (Argentina's National Space Activities Commission)"
year = 2018
orbit_class = "sso"
spacecraft_class = "large"
mass_kg = 3000.0
size_note = "radar Earth-observation satellite, about 3,000 kg"
purposes = ["glaciers", "earth-observation"]
blurb = "SAOCOM-1A, Argentina's L-band radar satellite, was launched on a Falcon 9 in October 2018 into a 620 km sun-synchronous orbit. Its survey of Antarctica studies how the continent's glaciers change, and its radar images the ground day and night through cloud."
url = "https://www.eoportal.org/satellite-missions/saocom"
# secondary (eoPortal, ESA-run catalogue): SAOCOM-1A launched 7/8 October 2018 on a Falcon 9 from Vandenberg;
# "altitude = 619.6 km" sun-synchronous; payload an L-band polarimetric SAR; objectives include "monitoring
# surveys of Antarctica (study of continental glacier evolution, global change indicators, etc.)". The page gives
# about 1600 kg for the bus alone and 3,000 kg for SAOCOM-1A at launch (3,050 kg on Wikipedia; Argentina's government
# announced "about 3,000 kg"); the launch mass is used, as for the other missions. SAOCOM carries
# a radar, not a camera: it matches by objective and Orbit.
verified = "secondary"

[[real_missions]]
name = "INSAT-3DR"
operator = "ISRO (Indian Space Research Organisation)"
year = 2016
orbit_class = "geo"
spacecraft_class = "large"
mass_kg = 2211.0
size_note = "meteorological satellite, about 2.2 t at launch"
purposes = ["weather", "earth-observation"]
blurb = "INSAT-3DR, an Indian weather satellite, was launched on a GSLV rocket on 8 September 2016 into geostationary orbit at 74 degrees East to watch the weather over India and the seas around it, with a six-band imager and a 19-channel sounder."
url = "https://www.eoportal.org/satellite-missions/insat-3dr"
# secondary (eoPortal, ESA-run catalogue): launch 8 September 2016 (11:20 UTC) on GSLV-F05, liftoff mass 2211 kg,
# geostationary at 74 deg East, a six-band Imager and a 19-channel Sounder, meteorological mission.
verified = "secondary"

