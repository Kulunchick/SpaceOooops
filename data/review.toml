# Launch Review thresholds.

[review]
# A gauge whose margin is below 15% of its limit turns amber (common early-design margin practice).
thin_margin_fraction = 0.15
# source: low-Earth-orbit lithium-ion batteries see ~5,500 eclipse cycles a year; missions keep each
# discharge to ~20% depth so the battery lasts several years.
battery_max_depth_of_discharge = 0.2
