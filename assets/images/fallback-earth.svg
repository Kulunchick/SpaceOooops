    <polygon points="1090,200 1390,200 1240,420" fill="#174a7c"/>
    <polygon points="1090,200 940,420 1240,420" fill="#1f5f99"/>
    <polygon points="790,200 940,420 790,640" fill="#174a7c"/>
    <polygon points="1390,200 1240,420 1390,640" fill="#1f5f99"/>
    <polygon points="940,420 1240,420 1090,640" fill="#174a7c"/>
    <polygon points="940,420 790,640 1090,640" fill="#1f5f99"/>
    <polygon points="1240,420 1390,640 1090,640" fill="#1f5f99"/>
    <polygon points="790,640 1090,640 940,820" fill="#174a7c"/>
    <polygon points="1090,640 1390,640 1240,820" fill="#174a7c"/>
    <polygon points="1090,640 940,820 1240,820" fill="#1f5f99"/>
    <!-- Africa -->
    <polygon points="960,250 1100,240 1160,300 1230,330 1210,400 1150,410" fill="#d9b26f"/>
    <polygon points="960,250 1150,410 1000,400 930,330" fill="#b5a45a"/>
    <polygon points="1000,400 1150,410 1180,480 1110,520 1040,460" fill="#3f8f4a"/>
    <polygon points="1150,410 1210,400 1250,430 1180,480" fill="#79a85a"/>
