  <circle cx="1090" cy="500" r="300" fill="none" stroke="#9fc4ff" stroke-opacity="0.35" stroke-width="4"/>
  <g transform="translate(1340 300) rotate(-20)">
    <rect x="-14" y="-10" width="28" height="20" fill="#e0b440" stroke="#0f1f3a" stroke-width="2"/>
    <rect x="-56" y="-6" width="38" height="12" fill="#2b4f9e" stroke="#0f1f3a" stroke-width="2"/>
    <rect x="18" y="-6" width="38" height="12" fill="#2b4f9e" stroke="#0f1f3a" stroke-width="2"/>
