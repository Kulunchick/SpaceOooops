<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Static low-poly backdrop used when WebGL is unavailable. Own work (SpaceOooops team), CC0. -->
  <defs>
    <radialGradient id="glow" cx="0.68" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#1b2b52"/>
      <stop offset="1" stop-color="#070b16"/>
    </radialGradient>
    <clipPath id="globe"><circle cx="1090" cy="500" r="300"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g fill="#cfd8ff">
    <circle cx="120" cy="90" r="2"/><circle cx="310" cy="210" r="1.5"/><circle cx="520" cy="70" r="2"/>
    <circle cx="700" cy="160" r="1.2"/><circle cx="240" cy="420" r="1.6"/><circle cx="90" cy="640" r="2"/>
    <circle cx="420" cy="780" r="1.4"/><circle cx="620" cy="560" r="1.2"/><circle cx="1480" cy="120" r="2"/>
    <circle cx="1380" cy="820" r="1.6"/><circle cx="1540" cy="520" r="1.3"/><circle cx="880" cy="60" r="1.5"/>
    <circle cx="760" cy="860" r="1.8"/><circle cx="1260" cy="60" r="1.2"/><circle cx="40" cy="300" r="1.4"/>
  </g>
  <g clip-path="url(#globe)" stroke="#0f1f3a" stroke-width="1.5" stroke-linejoin="round">
